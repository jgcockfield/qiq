<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QualifyIQ</title>
  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg: #ffffff;
      --panel: #f6f6f6;
      --panel-2: #fbfbfb;
      --border: #e6e6e6;
      --text: #111;
      --muted: #666;
      --bubble: #f2f2f2;
      --bubble-user: #111;
      --bubble-user-text: #fff;
      --shadow: 0 1px 2px rgba(0,0,0,0.06);
      --radius: 10px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --composer-max: 760px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }

    .app{ height:100%; display:flex; flex-direction:column; }

    /* Top bar */
    .topbar{
      height:44px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--border);
      background:var(--bg);
    }
    .iconbtn{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
      display:none; /* mobile only */
    }
    .iconbtn:active{ transform:translateY(1px); }
    .brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
    .brand-dot{ width:18px; height:18px; border-radius:6px; background:#111; }
    .topbar-spacer{ flex:1; }
    .status{ font-size:12px; color:var(--muted); }

    /* Body split */
    .body{ flex:1; min-height:0; display:flex; }

    .sidebar-scrim{
      display:none;
      position:fixed;
      inset:44px 0 0 0;
      background:rgba(0,0,0,0.18);
      z-index:40;
    }

    /* Mobile sidebar toggle */
    @media (max-width: 860px){
      .iconbtn{ display:inline-flex; align-items:center; justify-content:center; }
      .sidebar{
        position:fixed;
        top:44px;
        left:0;
        bottom:0;
        width:260px;
        transform:translateX(-110%);
        transition:transform .18s ease;
        z-index:50;
        box-shadow:0 8px 28px rgba(0,0,0,0.18);
      }
      .body.sidebar-open .sidebar{ transform:translateX(0); }
      .body.sidebar-open .sidebar-scrim{ display:block; }
    }

    /* Sidebar */
    .sidebar{
      width:220px;
      border-right:1px solid var(--border);
      background:var(--panel-2);
      display:flex;
      flex-direction:column;
      padding:10px;
      gap:10px;
    }

    .btn{
      border:1px solid var(--border);
      background:#111;
      color:#fff;
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
    }
    .btn:active{ transform:translateY(1px); }
    .btn.secondary{ background:#fff; color:#111; box-shadow:none; }

    .chatlist{ flex:1; min-height:0; overflow:auto; padding-right:4px; }

    .chatitem{
      border:1px solid transparent;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-size:12px;
      color:var(--text);
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .chatitem:hover{ background:var(--panel); }
    .chatitem.active{ background:var(--panel); border-color:var(--border); }
    .chatitem .title{ font-weight:600; }
    .chatitem .sub{ color:var(--muted); font-size:11px; }

    /* Main */
    .main{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; background:#fff; }

    .messages{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:18px 0;
      display:block; /* remove flex centering so bottom padding works */
      position:relative;
      background: url('https://qiq.gonimbleai.com/images/chatbot_bg.jpg') center center / cover no-repeat;
    }

    .messages::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.85);
      pointer-events:none;
    }

    .messages-inner{
      position:relative;
      width:100%;
      max-width:var(--composer-max);
      margin:0 auto;
      padding:0 18px 220px; /* bottom space so last message clears composer */
      display:flex;
      flex-direction:column;
    }

    .bubble-row{ display:flex; margin:10px 0; }
    .bubble-row.user{ justify-content:flex-end; }

    .bubble{
      max-width:760px;
      padding:10px 12px;
      border-radius:var(--radius);
      background:var(--bubble);
      box-shadow:var(--shadow);
      font-size:13px;
      line-height:1.35;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .bubble.user{ background:var(--bubble-user); color:var(--bubble-user-text); }

    .choices{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .chip{
      border:1px solid var(--border);
      background:#fff;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
    }
    .chip:hover{ background:var(--panel); }
    .chip.selected{ background:#111; color:#fff; border-color:#111; }
    .chip:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
    .chip:disabled:hover{ background:#fff; }
    .chip:hover{ background:var(--panel); }
    .chip.selected{ background:#111; color:#fff; border-color:#111; }
    .choice-actions{ margin-top:10px; display:flex; gap:8px; align-items:center; }
    .choice-hint{ font-size:11px; color:var(--muted); }

    /* === CENTERED COMPOSER (ChatGPT-style) === */
    .composer{
      border-top:1px solid var(--border);
      background:var(--bg);
      padding:16px 0 20px;
      display:flex;
      justify-content:center;
    }

    .composer-inner{
      width:100%;
      max-width:var(--composer-max);
      padding:0 18px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .promptlabel{ font-size:12px; color:var(--muted); }

    .composer-row{
      display:flex;
      align-items:flex-end;
      gap:10px;
    }

    textarea{
      flex:1;
      resize:none;
      border:1px solid var(--border);
      border-radius:18px;
      padding:12px 14px;
      font-family:var(--font);
      font-size:13px;
      outline:none;
      min-height:44px;
      max-height:140px;
      overflow:auto;
      background:#fff;
    }

    .send{
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#111;
      color:#fff;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
    }

    .send:disabled{ opacity:.5; cursor:not-allowed; }

    .debug{
      font-size:11px;
      color:var(--muted);
      padding:0 18px 12px 18px;
    }
    .debug code{ font-size:11px; }
  </style>
</head>
<body>
  <div class="app">

    <div class="topbar">
      <button class="iconbtn" id="sidebarToggle" aria-label="Toggle sidebar" title="Menu">☰</button>
      <div class="brand"><span class="brand-dot"></span> QualifyIQ</div>
      <div class="topbar-spacer"></div>
      <div class="status" id="status">Disconnected</div>
    </div>

    <div class="body" id="body">

      <aside class="sidebar">
        <button class="btn" id="newChatBtn">+ New Chat</button>
        <div class="chatlist" id="chatList"></div>
        <button class="btn secondary" id="clearStorageBtn" title="Local only">Clear local</button>
      </aside>

      <div class="sidebar-scrim" id="sidebarScrim"></div>

      <main class="main">
        <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>

        <div class="composer">
          <div class="composer-inner">
            <div class="promptlabel" id="promptLabel">Waiting for engine…</div>
            <div class="composer-row">
              <textarea id="textInput" rows="1" placeholder="Type your message…"></textarea>
              <button class="send" id="sendBtn" title="Send">➤</button>
            </div>
            
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    /*****************************************************************
     * CONFIG
     *****************************************************************/
    // If /evaluate is served on the SAME origin as this page, leave API_URL = "".
    // If different origin (e.g., https://api.gonimbleai.com), set it here.
    const API_URL = "";
    const EVALUATE_PATH = "/evaluate"; // FastAPI endpoint


    // Local-only persistence for UI convenience
    const STORAGE_KEY = "qiq_chats_v1";

    /*****************************************************************
     * STATE
     *****************************************************************/
    let chats = loadChats();
    let activeChatId = chats.activeChatId || null;

    function makeId(){
      return Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function nowIso(){
      return new Date().toISOString();
    }

    function loadChats(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return { activeChatId:null, items:[] };
        return JSON.parse(raw);
      }catch{
        return { activeChatId:null, items:[] };
      }
    }

    function saveChats(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeChatId, items: chats.items }));
    }

    function getActiveChat(){
      return chats.items.find(c => c.id === activeChatId) || null;
    }

    function setStatus(text){
      document.getElementById("status").textContent = text;
    }

    function setPromptLabel(text){
      document.getElementById("promptLabel").textContent = text;
    }

    function setDebug(){ /* debug disabled */ }

    function escapeHtml(s){
      return s
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // Display-only label normalization (keep raw values for the engine)
    function displayChoiceLabel(v){
      return String(v ?? "")
        .replaceAll("_", " ")
        .replaceAll(/\s+/g, " ")
        .trim();
    }

    function buildCompletionText(raw, exports){
      exports = exports || {};
      const meta = raw.meta || {};
      const status = meta.status || raw.eligibility_status || "";
      const work = meta.work_relationship || meta.work_type || raw.work_relationship || "";
      const visa = meta.visa_type || "";

      let html = '<div style="font-family:var(--font); line-height:1.5; white-space:normal;">';
      html += '<div style="font-weight:600; font-size:14px; margin-bottom:8px;">Eligibility Summary</div>';
      if(status) html += `<div style="font-size:13px;">Status: ${status}</div>`;
      if(work) html += `<div style="font-size:13px;">Work Type: ${work}</div>`;
      if(visa) html += `<div style="font-size:13px;">Visa Type: ${visa}</div>`;
      
      const summary = raw.summary || raw.summary_text || "";
      if(summary) html += `<div style="margin-top:12px; font-size:13px;">${summary}</div>`;

      const clar = raw.clarifications;
      if(Array.isArray(clar) && clar.length){
        html += '<div style="margin-top:16px; font-weight:600; font-size:14px;">Clarifications</div>';
        for(const c of clar){
          if(!c) continue;
          html += '<div style="margin:16px 0; padding:12px; background:#f9f9f9; border-left:3px solid #111; border-radius:4px;">';
          if(c.title) html += `<div style="font-weight:600; font-size:14px; margin-bottom:8px;">${c.title}</div>`;
          if(c.clarification) html += `<div style="font-size:13px; line-height:1.4; margin-bottom:12px; color:#333;">${c.clarification}</div>`;

          // Extra criminal background sections (if present)
          if(c.police_clearance_requirement && typeof c.police_clearance_requirement === "object"){
            const pcr = c.police_clearance_requirement;
            html += '<div style="margin-top:10px; font-weight:600; font-size:12px; color:#666;">Police clearance requirements:</div>';
            if(Array.isArray(pcr.criteria) && pcr.criteria.length){
              html += '<ul style="margin:6px 0 0 18px; padding-left:18px; font-size:12px; color:#444;">';
              pcr.criteria.forEach(item => html += `<li style=\"margin:2px 0;\">${item}</li>`);
              html += '</ul>';
            }
          }

          if(c.handling && typeof c.handling === "object"){
            const h = c.handling;
            html += '<div style="margin-top:10px; font-weight:600; font-size:12px; color:#666;">How this is handled:</div>';
            if(h.no_criminal_record) html += `<div style=\"margin-top:6px; font-size:12px; color:#444;\"><strong>No record:</strong> ${h.no_criminal_record}</div>`;
            if(h.criminal_record_disclosed) html += `<div style=\"margin-top:6px; font-size:12px; color:#444;\"><strong>Record disclosed:</strong> ${h.criminal_record_disclosed}</div>`;
          }

          if(c.boundary && typeof c.boundary === "object"){
            const b = c.boundary;
            html += '<div style="margin-top:10px; font-weight:600; font-size:12px; color:#666;">Important boundary:</div>';
            if(b.case_by_case_review) html += `<div style=\"margin-top:6px; font-size:12px; color:#444;\">${b.case_by_case_review}</div>`;
            if(b.legal_deferral) html += `<div style=\"margin-top:6px; font-size:12px; color:#444;\"><strong>Legal guidance:</strong> ${b.legal_deferral}</div>`;
          }

          if(Array.isArray(c.secondary_evidence) && c.secondary_evidence.length){
            html += '<div style="font-weight:600; font-size:12px; margin-top:12px; margin-bottom:8px; color:#666;">Alternative Evidence Options:</div>';
            for(const ev of c.secondary_evidence){
              html += '<div style="margin:8px 0 12px 12px; padding-left:12px; border-left:2px solid #ddd;">';
              if(ev.label) html += `<div style="font-weight:600; font-size:12px; color:#111;">${ev.label}</div>`;
              if(ev.description) html += `<div style="font-size:12px; color:#555; margin:4px 0;">${ev.description}</div>`;
              
              const makeList = (arr, title) => {
                if(!Array.isArray(arr) || !arr.length) return '';
                let out = `<div style="margin:4px 0; font-size:11px; color:#666;"><strong>${title}:</strong><ul style="margin:4px 0; padding-left:20px;">`;
                arr.forEach(item => out += `<li style="margin:2px 0;">${item}</li>`);
                return out + '</ul></div>';
              };
              
              html += makeList(ev.should_state, 'Should state');
              html += makeList(ev.must_include, 'Must include');
              html += makeList(ev.must_clearly_show, 'Must clearly show');
              html += makeList(ev.requirements, 'Requirements');
              html += makeList(ev.notes, 'Notes');
              html += '</div>';
            }
          }
          html += '</div>';
        }
      }

      const cta = raw.cta || raw.next_steps || raw.nextSteps;
      const toText = (v) => !v ? "" : Array.isArray(v) ? v.filter(Boolean).map(String).join("<br>") : String(v);
      const ctaText = (typeof cta === "string") ? cta : toText(cta?.text);
      if(ctaText) html += `<div style="margin-top:16px; font-size:13px;">${ctaText}</div>`;
      
      const action = cta?.action || null;
      const actionLabel = action?.label || action?.text || cta?.action_label || cta?.actionLabel || "";
      if(actionLabel) html += `<div style="margin-top:12px; font-size:13px;">${actionLabel}</div>`;

      // Export links (from wrapper)
      const mkLink = (href, label) => {
        if(!href) return "";
        const abs = (API_URL || "") + href;
        return `<a href="${abs}" target="_blank" rel="noopener" style="display:inline-block; padding:8px 10px; border-radius:999px; border:1px solid #111; background:#111; color:#fff; text-decoration:none; font-size:12px;">${label}</a>`;
      };

      const edrLink = mkLink(exports.edr_url, "Download JSON");
      const pdfLink = mkLink(exports.pdf_url, "Download PDF");

      if(edrLink || pdfLink){
        html += `<div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">${pdfLink}${edrLink}</div>`;
      }

      html += '</div>';
      return html;
    }


    /*****************************************************************
     * RENDER
     *****************************************************************/
    function renderChatList(){
      const list = document.getElementById("chatList");
      list.innerHTML = "";

      if(chats.items.length === 0){
        const empty = document.createElement("div");
        empty.style.color = "#666";
        empty.style.fontSize = "12px";
        empty.style.padding = "10px";
        empty.textContent = "No chats yet.";
        list.appendChild(empty);
        return;
      }

      for(const chat of chats.items){
        const item = document.createElement("div");
        item.className = "chatitem" + (chat.id === activeChatId ? " active" : "");
        item.onclick = () => { activeChatId = chat.id; saveChats(); refresh(); };

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = chat.title || "New chat";

        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = chat.updated_at ? new Date(chat.updated_at).toLocaleString() : "";

        item.appendChild(title);
        item.appendChild(sub);
        list.appendChild(item);
      }
    }

    function renderMessages(){
      const wrap = document.getElementById("messagesInner");
      const chat = getActiveChat();
      const activeKey = chat?.last_engine?.next_field_key ?? null;
      wrap.innerHTML = "";
      if(!chat){
        const empty = document.createElement("div");
        empty.style.color = "#666";
        empty.style.fontSize = "13px";
        empty.style.padding = "18px";
        empty.textContent = "Start a new chat.";
        wrap.appendChild(empty);
        return;
      }

      for(const m of chat.messages){
        const row = document.createElement("div");
        row.className = "bubble-row " + (m.role === "user" ? "user" : "assistant");

        const bubble = document.createElement("div");
        bubble.className = "bubble " + (m.role === "user" ? "user" : "");
        if(m.is_completion_html){ bubble.innerHTML = m.text || ""; } else { bubble.textContent = m.text || ""; }

        row.appendChild(bubble);
        wrap.appendChild(row);

        

        if(Array.isArray(m.choices) && m.choices.length){
          const choices = document.createElement("div");
          choices.className = "choices";

          const isMulti = m.input_type === "multi_choice";
          const fieldKey = m.field_key || null;
          const isActiveQuestion = !!(fieldKey && activeKey && fieldKey === activeKey);

          // Local selection state (per chat + field)
          const chatState = getActiveChat();
          if(isMulti && chatState && fieldKey){
            if(!chatState.pending_multi) chatState.pending_multi = {};
            if(!Array.isArray(chatState.pending_multi[fieldKey])) chatState.pending_multi[fieldKey] = [];
          }

          for(const choice of m.choices){
            const chip = document.createElement("button");
            chip.className = "chip";
            chip.type = "button";
            chip.textContent = displayChoiceLabel(choice);
            chip.disabled = !isActiveQuestion;

            if(isMulti && chatState && fieldKey){
              const selected = chatState.pending_multi[fieldKey].includes(choice);
              if(selected) chip.classList.add("selected");

              chip.onclick = () => {
                if(!isActiveQuestion) return;
                const arr = chatState.pending_multi[fieldKey];
                const idx = arr.indexOf(choice);
                if(idx >= 0){ arr.splice(idx, 1); chip.classList.remove("selected"); }
                else { arr.push(choice); chip.classList.add("selected"); }
                saveChats();

                // Enable/disable the submit button
                const submitBtn = document.getElementById(`submit_multi__${fieldKey}`);
                if(submitBtn) submitBtn.disabled = arr.length === 0;
              };
            }else{
              chip.onclick = () => {
                if(!isActiveQuestion) return;
                // UI never infers next question. A chip click is just a convenience to submit a value.
                const input = document.getElementById("textInput");
                sendValue(fieldKey, choice, displayChoiceLabel(choice));
              };
            }

            choices.appendChild(chip);
          }

          wrap.appendChild(choices);

          // Multi-choice submit row
          if(isMulti && fieldKey && chatState){
            const actions = document.createElement("div");
            actions.className = "choice-actions";

            const hint = document.createElement("div");
            hint.className = "choice-hint";
            hint.textContent = "Select all that apply, then submit.";

            const submit = document.createElement("button");
            submit.className = "btn";
            submit.type = "button";
            submit.id = `submit_multi__${fieldKey}`;
            submit.textContent = "Submit";
            submit.disabled = (!isActiveQuestion) || (chatState.pending_multi[fieldKey].length === 0);
            submit.onclick = () => { if(!isActiveQuestion) return; submitMultiChoice(fieldKey); };

            actions.appendChild(submit);
            actions.appendChild(hint);
            wrap.appendChild(actions);
          }
        }
      }

      // Auto-scroll the visible scroll container (#messages), not the inner wrapper.
      
      const messagesEl = document.getElementById("messages");
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function refresh(){
      renderChatList();
      renderMessages();
      syncComposerState();
      const active = getActiveChat();
      setDebug(active && active.last_engine ? active.last_engine : null);
    }

    /*****************************************************************
     * ENGINE WIRING (STRICT CONSUMER)
     * - UI never decides next question.
     * - UI only writes to next_field_key.
     * - UI renders metadata returned by /evaluate.
     *****************************************************************/

    async function callEvaluate(payload){
      const url = (API_URL || "") + EVALUATE_PATH;

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if(!res.ok){
        const txt = await res.text().catch(() => "");
        throw new Error(`Evaluate failed (${res.status}): ${txt}`);
      }

      return res.json();
    }

    // Normalize backend response to the minimal shape we render.
    // IMPORTANT: The UI has NO question map. It only uses what the backend returns.
    let isSubmitting = false;

    function normalizeEngineResponse(raw){
      // Preserve wrapper export links before unwrapping
      const exports = {
        edr_url: raw?.edr_url ?? raw?.edrUrl ?? null,
        pdf_url: raw?.pdf_url ?? raw?.pdfUrl ?? null,
      };

      // unwrap export wrapper if present
      const payload = raw && raw.result ? raw.result : raw;

      const next_field_key = payload.next_field_key ?? payload.nextFieldKey ?? null;

      // Completion payload (P7): backend may return a final structured output object
      const isCompletionPayload = (
        next_field_key === null && (
          payload.completed === true ||
          payload.meta || payload.summary || payload.clarifications || payload.next_steps || payload.cta
        )
      );

      if(isCompletionPayload){
        const label = buildCompletionText(payload, exports);
        return { next_field_key: null, label, input_type: "text", choices: [], raw: payload, is_completion_html: true };
      }

      // Try common shapes: payload.field OR payload.next_question
      const fieldMeta = payload.field ?? payload.next_question ?? payload.nextQuestion ?? null;

      const label =
        fieldMeta?.label ??
        fieldMeta?.prompt ??
        (next_field_key ? `Answer: ${next_field_key}` : "Complete");

      const input_type =
        fieldMeta?.input_type ??
        fieldMeta?.answer_type ??
        "text";

      const choices =
        fieldMeta?.choices ??
        fieldMeta?.options ??
        [];

      return { next_field_key, label, input_type, choices, raw: payload };
    }

    function getBaseIntake(){
      // Start with an empty payload. External systems (e.g., Gravity Forms)
      // provide identity fields; the engine will request routing first.
      return {};
    }

    function ensureActiveChat(){
      let chat = getActiveChat();
      if(chat) return chat;

      const id = makeId();
      chat = {
        id,
        title: "New chat",
        created_at: nowIso(),
        updated_at: nowIso(),
        intake: getBaseIntake(),
        last_engine: null,
        messages: []
      };

      chats.items.unshift(chat);
      activeChatId = id;
      saveChats();
      return chat;
    }

    function syncComposerState(){
      const chat = getActiveChat();
      const input = document.getElementById("textInput");
      const btn = document.getElementById("sendBtn");

      if(!chat || !chat.last_engine){
        btn.disabled = true;
        input.disabled = false;
        setPromptLabel("Waiting for engine…");
        return;
      }

      const { next_field_key, label, choices } = chat.last_engine;

      if(!next_field_key){
        // Completion: do NOT assume eligible. Respect backend eligibility_status.
        const status = (chat.last_engine?.raw?.eligibility_status) || (chat.last_engine?.raw?.meta?.status) || "";
        if(String(status).toLowerCase() === "needs_review") setPromptLabel("Needs Review");
        else setPromptLabel("Complete");

        btn.disabled = true;
        input.disabled = true;
        return;
      }

      // P6-S3: if choices exist, force picklist (no free text)
      if(Array.isArray(choices) && choices.length){
        input.disabled = true;
        btn.disabled = true;
      }else{
        input.disabled = false;
        btn.disabled = false;
      }

      setPromptLabel(label || next_field_key);
    }

    async function bootstrapEngine(){
      const chat = ensureActiveChat();
      const btn = document.getElementById("sendBtn");
      try{
        setStatus("Connecting…");

        console.log("INTAKE PAYLOAD", JSON.stringify(chat.intake, null, 2));
        const raw = await callEvaluate(chat.intake);
        console.log("EVALUATE RESPONSE", raw);
        const norm = normalizeEngineResponse(raw);
        chat.last_engine = norm;

        chat.messages.push({
          role: "assistant",
          text: norm.label || "…",
          choices: Array.isArray(norm.choices) ? norm.choices : [],
          field_key: norm.next_field_key || null,
          input_type: norm.input_type || "text",
          is_completion_html: norm.is_completion_html || false,
        });

        // Title: set only after first USER message (avoid undefined vars on bootstrap)
        // Leave as "New chat" until the user answers at least once.
        chat.updated_at = nowIso();
        saveChats();
        setStatus("Connected");
        setDebug(norm);
        refresh();
      }catch(err){
        setStatus("Error");
        chat.messages.push({
          role: "assistant",
          text: `Engine call failed.
${String(err.message || err)}`,
        });
        chat.updated_at = nowIso();
        saveChats();
        refresh();
      }finally{
        btn.disabled = false;
        isSubmitting = false;
      }
    }

    async function submitMultiChoice(fieldKey){
      const chat = ensureActiveChat();
      const selectedRaw = (chat.pending_multi && Array.isArray(chat.pending_multi[fieldKey]))
        ? chat.pending_multi[fieldKey]
        : [];

      // Defensive de-duplication
      const selected = Array.from(new Set(selectedRaw));
      if(!selected.length) return;

      // Clear pending after capture
      chat.pending_multi[fieldKey] = [];
      saveChats();

      await sendValue(fieldKey, selected, selected.map(displayChoiceLabel).join(", "));
    }

    async function sendCurrent(){
      const chat = ensureActiveChat();
      if(!chat.last_engine) return;

      const inputEl = document.getElementById("textInput");
      const val = (inputEl.value || "").trim();
      if(!val) return;

      const { next_field_key } = chat.last_engine;
      if(!next_field_key) return;

      // Clear textarea immediately after capture (keeps strict consumer mode).
      inputEl.value = "";
      autosize(inputEl);

      // P6-S4 rollback: UI does NOT coerce/validate numeric types in P6.
      const finalVal = val;
      await sendValue(next_field_key, finalVal, val);
    }

    async function sendValue(fieldKey, value, displayText){
      const chat = ensureActiveChat();
      if(!fieldKey) return;

      // Write into dotted intake payload
      setDotted(chat.intake, fieldKey, value);

      // Record user bubble (displayText is what UI shows; value is what engine receives)
      chat.messages.push({
        role: "user",
        text: String(displayText ?? value),
      });

      try{
        setStatus("Sending…");
        console.log("INTAKE PAYLOAD", JSON.stringify(chat.intake, null, 2));
        const raw = await callEvaluate(chat.intake);
        console.log("EVALUATE RESPONSE", raw);
        const norm = normalizeEngineResponse(raw);
        chat.last_engine = norm;

        chat.messages.push({
          role: "assistant",
          text: norm.label || "…",
          choices: Array.isArray(norm.choices) ? norm.choices : [],
          field_key: norm.next_field_key || null,
          input_type: norm.input_type || "text",
          is_completion_html: norm.is_completion_html || false,
        });

        // Title: set after first USER message
        if(chat.title === "New chat"){
          const v = String(displayText ?? "").trim();
          if(v){
            chat.title = v.length > 28 ? v.slice(0,28) + "…" : v;
          }
        }

        chat.updated_at = nowIso();
        saveChats();
        setStatus("Connected");
        setDebug(norm);
        refresh();
      }catch(err){
        setStatus("Error");
        chat.messages.push({
          role: "assistant",
          text: `Engine call failed.
${String(err.message || err)}`,
        });
        chat.updated_at = nowIso();
        saveChats();
        refresh();
      }
    }

    function setDotted(obj, path, value){
      const parts = String(path).split(".");
      let cur = obj;
      for(let i=0;i<parts.length-1;i++){
        const k = parts[i];
        if(typeof cur[k] !== "object" || cur[k] === null) cur[k] = {};
        cur = cur[k];
      }
      cur[parts[parts.length-1]] = value;
    }

    /*****************************************************************
     * UI EVENTS
     *****************************************************************/
    function autosize(el){
      el.style.height = "0px";
      el.style.height = Math.min(el.scrollHeight, 140) + "px";
    }

    document.getElementById("textInput").addEventListener("input", (e) => autosize(e.target));

    document.getElementById("textInput").addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendCurrent();
      }
    });

    document.getElementById("sendBtn").addEventListener("click", sendCurrent);

    document.getElementById("newChatBtn").addEventListener("click", () => {
      const id = makeId();
      chats.items.unshift({
        id,
        title: "New chat",
        created_at: nowIso(),
        updated_at: nowIso(),
        intake: getBaseIntake(),
        last_engine: null,
        messages: []
      });
      activeChatId = id;
      saveChats();
      refresh();
      bootstrapEngine();
    });

    document.getElementById("clearStorageBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      chats = { activeChatId:null, items:[] };
      activeChatId = null;
      refresh();
      bootstrapEngine();
    });

    // Mobile sidebar toggle (layout only)
    const bodyEl = document.getElementById("body");
    const toggleBtn = document.getElementById("sidebarToggle");
    const scrimEl = document.getElementById("sidebarScrim");

    function closeSidebar(){ bodyEl.classList.remove("sidebar-open"); }
    function toggleSidebar(){ bodyEl.classList.toggle("sidebar-open"); }

    if(toggleBtn) toggleBtn.addEventListener("click", toggleSidebar);
    if(scrimEl) scrimEl.addEventListener("click", closeSidebar);

    // Close sidebar after selecting a chat on mobile
    document.getElementById("chatList").addEventListener("click", () => {
      if(window.matchMedia && window.matchMedia("(max-width: 860px)").matches) closeSidebar();
    });

    /*****************************************************************
     * BOOT
     *****************************************************************/
    (function init(){
      if(!activeChatId && chats.items.length){
        activeChatId = chats.items[0].id;
      }

      saveChats();
      refresh();

      const active = getActiveChat();

      // If there is no engine state OR it says "Complete", force a fresh bootstrap
      if(!active || !active.last_engine || !active.last_engine.next_field_key){
        bootstrapEngine();
        return;
      }

      setStatus("Connected");
      setDebug(active.last_engine);
      syncComposerState();
    })();

    // Global error containment (P6-S5)
    window.addEventListener("error", () => {
      const btn = document.getElementById("sendBtn");
      isSubmitting = false;
      if(btn) btn.disabled = false;
      setStatus("Error");
    });

    window.addEventListener("unhandledrejection", () => {
      const btn = document.getElementById("sendBtn");
      isSubmitting = false;
      if(btn) btn.disabled = false;
      setStatus("Error");
    });
  </script>
</body>
</html>
