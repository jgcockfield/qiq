<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QualifyIQ</title>
  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg: #ffffff;
      --panel: #f6f6f6;
      --panel-2: #fbfbfb;
      --border: #e6e6e6;
      --text: #111;
      --muted: #666;
      --bubble: #f2f2f2;
      --bubble-user: #111;
      --bubble-user-text: #fff;
      --shadow: 0 1px 2px rgba(0,0,0,0.06);
      --radius: 10px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      --composer-max: 760px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }

    .app{ height:100%; display:flex; flex-direction:column; }

    /* Top bar */
    .topbar{
      height:44px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--border);
      background:var(--bg);
    }
    .iconbtn{
      width:34px;
      height:34px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#fff;
      color:#111;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
      display:none; /* desktop hidden */
    }
    .iconbtn:active{ transform:translateY(1px); }

    .brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
    .brand-dot{ width:18px; height:18px; border-radius:6px; background:#111; }
    .topbar-spacer{ flex:1; }
    .status{ font-size:12px; color:var(--muted); }

    /* Body split */
    .body{ flex:1; min-height:0; display:flex; }

    /* Sidebar */
    .sidebar{
      width:220px;
      border-right:1px solid var(--border);
      background:var(--panel-2);
      display:flex;
      flex-direction:column;
      padding:10px;
      gap:10px;
    }

    .btn{
      border:1px solid var(--border);
      background:#111;
      color:#fff;
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
      box-shadow:var(--shadow);
      user-select:none;
    }
    .btn:active{ transform:translateY(1px); }
    .btn.secondary{ background:#fff; color:#111; box-shadow:none; }

    .chatlist{ flex:1; min-height:0; overflow:auto; padding-right:4px; }

    .chatitem{
      border:1px solid transparent;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-size:12px;
      color:var(--text);
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .chatitem:hover{ background:var(--panel); }
    .chatitem.active{ background:var(--panel); border-color:var(--border); }
    .chatitem .title{ font-weight:600; }
    .chatitem .sub{ color:var(--muted); font-size:11px; }

    /* Main */
    .main{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; background:#fff; }

    .messages{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:18px 0;
      display:flex;
      justify-content:center;
      position:relative;
      background: url('https://qiq.gonimbleai.com/images/chatbot_bg.jpg') center center / cover no-repeat;
    }

    .messages::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(255,255,255,0.85);
      pointer-events:none;
    }

    .messages-inner{
      position:relative;
      width:100%;
      max-width:var(--composer-max);
      padding:0 18px 180px; /* bottom space tuned for mobile (70% traffic) */
