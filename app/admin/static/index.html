<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - QualifyIQ</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="http://gonimbleai.com/wp-content/uploads/2026/01/LOGO-QIQ-1.webp" alt="QualifyIQ" class="admin-logo" style="height:28px;width:auto;" />
            
</header>

        <div class="layout">
            <!-- Records List (Runs) -->
            <aside class="list-panel" style="width: 100%;">
                <div class="panel-header">
                    <h2>Records</h2>
                    <button id="refresh-btn" class="btn-secondary">Refresh</button>
                </div>

                <div id="edr-list" class="edr-list">
                    <p class="loading">Loading...</p>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Chat Log Modal -->
    <div id="chat-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;padding:20px;">
        <div style="background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
            <div style="padding:18px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
                <div id="chat-modal-title" style="font-weight:700;font-size:14px;color:#111;"></div>
                <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#666;line-height:1;">&times;</button>
            </div>
            <div id="chat-modal-body" style="padding:20px;overflow-y:auto;flex:1;"></div>
        </div>
    </div>

    <script src="/admin/admin.js"></script>
</body>
</html>
